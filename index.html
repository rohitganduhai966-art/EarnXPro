/* ============================================================
   HELPERS
   ============================================================ */

function makeId(prefix = "EX") {
    return prefix + Date.now().toString(36) + Math.random()
        .toString(36)
        .substring(2, 8);
}

function collectionToArray(value) {
    if (!value) return [];

    if (Array.isArray(value)) {
        return value.filter(Boolean);
    }

    if (typeof value === "object") {
        return Object.entries(value).map(([key, value]) => {
            if (value && typeof value === "object" && !value._firebaseKey) {
                value._firebaseKey = key;
            }
            return value;
        }).filter(Boolean);
    }

    return [];
}

function money(value) {
    return Number(value || 0);
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function getUserByPhone(phone) {
    return db.users.find(u => u && u.phone === phone) || null;
}

function getUserKey(user) {
    if (!user) return null;

    if (user.uid) return user.uid;
    if (user._firebaseKey && !/^\d+$/.test(user._firebaseKey)) {
        return user._firebaseKey;
    }

    return null;
}


/* ============================================================
   DATABASE WRITE HELPERS
   ============================================================ */

/*
 * IMPORTANT:
 * These functions write ONLY the requested child.
 * They never overwrite the Firebase root.
 */

function saveUser(user) {
    if (!user || !user.phone) {
        return Promise.reject(new Error("Invalid user"));
    }

    if (!user.uid) {
        user.uid = makeId("UID");
    }

    return rtdb.ref("users/" + user.uid)
        .set(user)
        .then(() => {
            localStorage.setItem(
                "earnx_current_user",
                JSON.stringify(user)
            );
        })
        .catch(error => {
            console.error("User save failed:", error);
            alert("Could not save user data. Please try again.");
            throw error;
        });
}

function saveRecord(collection, recordId, data) {
    if (!collection || !recordId || !data) {
        return Promise.reject(new Error("Invalid record"));
    }

    return rtdb.ref(collection + "/" + recordId)
        .set(data)
        .catch(error => {
            console.error("Database write failed:", error);
            alert("Database save failed. Please try again.");
            throw error;
        });
}

function updateRecord(collection, recordId, updates) {
    return rtdb.ref(collection + "/" + recordId)
        .update(updates)
        .catch(error => {
            console.error("Database update failed:", error);
            alert("Database update failed. Please try again.");
            throw error;
        });
}

function deleteRecord(collection, recordId) {
    return rtdb.ref(collection + "/" + recordId)
        .remove()
        .catch(error => {
            console.error("Database delete failed:", error);
            alert("Database delete failed. Please try again.");
            throw error;
        });
}


/* ============================================================
   FIREBASE REALTIME SYNC
   ============================================================ */

/*
 * We listen to the individual collections instead of the whole
 * database root. This reduces stale-root overwrite problems.
 */

rtdb.ref("users").on("value", snapshot => {
    db.users = collectionToArray(snapshot.val());

    /*
     * Remove accidental duplicate users by phone.
     * The newest/UID-based record is preferred.
     */
    const seen = new Set();

    db.users = db.users.filter(user => {
        if (!user || !user.phone) return false;

        if (seen.has(user.phone)) return false;

        seen.add(user.phone);
        return true;
    });

    syncCurrentUser();
    firebaseLoaded = true;
});

rtdb.ref("deposits").on("value", snapshot => {
    db.deposits = collectionToArray(snapshot.val());
    syncCurrentUser();
});

rtdb.ref("withdraws").on("value", snapshot => {
    db.withdraws = collectionToArray(snapshot.val());
    syncCurrentUser();
});

rtdb.ref("products").on("value", snapshot => {
    db.products = collectionToArray(snapshot.val());
    renderProductsSafely();
    renderAdminSafely();
});

rtdb.ref("investments").on("value", snapshot => {
    db.investments = collectionToArray(snapshot.val());
    syncCurrentUser();
});

rtdb.ref("teamCommissions").on("value", snapshot => {
    db.teamCommissions = collectionToArray(snapshot.val());
    syncCurrentUser();
});


function syncCurrentUser() {

            dashboard &&

}

function renderProductsSafely() {

function calculateVipLevel(amount) {

    amount = money(amount);

    if (amount >= 100000) return 10;
    if (amount >= 45000) return 9;
    if (amount >= 35000) return 8;
    if (amount >= 25000) return 7;
    if (amount >= 15000) return 6;
    if (amount >= 10000) return 5;
    if (amount >= 5600) return 4;
    if (amount >= 3500) return 3;
    if (amount >= 1500) return 2;
    if (amount >= 200) return 1;

    return 0;
}


/* ============================================================
   PRODUCT / INVESTMENT EXPIRY
   ============================================================ */

function checkProductExpiries() {

    if (!firebaseLoaded) return;

    const now = Date.now();
    const productExpiry = 24 * 60 * 60 * 1000;

    /*
     * Product expiry only removes the product OFFER.
     * It does not delete investments.
     */

    db.products.forEach(product => {

        if (!product.createdAt) return;

        if (
            now - Number(product.createdAt) >=
            productExpiry
        ) {

            const key =
                product._firebaseKey ||
                product.id;

            if (key) {
                deleteRecord("products", key)
                    .catch(() => {});
            }
        }
    });

    /*
     * Investment maturity is checked locally.
     *
     * For a real financial application, this should be moved to
     * trusted server-side code/Cloud Functions because a browser
     * cannot be trusted to credit balances.
     */

    db.investments.forEach(inv => {

        if (!inv || inv.matured) return;

        if (
            inv.maturityTime &&
            now >= Number(inv.maturityTime)
        ) {
            markInvestmentMatured(inv);
        }
    });
}


function markInvestmentMatured(inv) {

    if (!inv || inv.matured) return;

    const investmentKey =
        inv._firebaseKey || inv.id;

    if (!investmentKey) return;

    const user = getUserByPhone(inv.phone);

    if (!user) return;

    const newBalance =
        money(user.balance) + money(inv.returnAmount);

    const newWithdrawBalance =
        money(user.withdrawBal) + money(inv.returnAmount);

    const updates = {};

    updates[
        "investments/" +
        investmentKey +
        "/matured"
    ] = true;

    updates[
        "investments/" +
        investmentKey +
        "/maturedAt"
    ] = Date.now();

    updates[
        "users/" +
        user.uid +
        "/balance"
    ] = newBalance;

    updates[
        "users/" +
        user.uid +
        "/withdrawBal"
    ] = newWithdrawBalance;

    rtdb.ref().update(updates)
        .then(() => {
            console.log(
                "Investment maturity recorded:",
                investmentKey
            );
        })
        .catch(error => {
            console.error(
                "Investment maturity failed:",
                error
            );
        });
}

function sendSignupOTP() {

    let phone =
        document.getElementById("signupPhone").value.trim();

    if (!phone || phone.length < 10) {
        alert("Please enter a valid phone number");
        return;
    }

    let existing = getUserByPhone(phone);

    if (existing) {
        alert("This mobile number is already registered!");
        return;
    }

    alert("OTP sent successfully: 1234");

    document.getElementById("signupOtp").value = "1234";
}


async function handleSignup() {

    let phone =
        document.getElementById("signupPhone").value.trim();

    let otp =
        document.getElementById("signupOtp").value.trim();

    let password =
        document.getElementById("signupPassword").value;

    if (!phone || !otp || !password) {
        alert("All fields are required");
        return;
    }

    if (otp !== "1234") {
        alert("Invalid OTP");
        return;
    }

    let existing = getUserByPhone(phone);

    if (existing) {
        alert("Number already registered!");
        return;
    }

    /*
     * Permanent UID.
     * It is generated ONCE and saved in Firebase.
     */
    const uid = makeId("UID");

    const newUser = {

        uid: uid,

        /*
         * Existing UI has no separate name field, so keep a
         * stable display name rather than generating a random
         * name on every render.
         */
        name: "User_" + phone.slice(-4),

        phone: phone,
        password: password,

        balance: 0,
        rechargeBal: 0,
        withdrawBal: 0,

        vipLevel: 0,

        bank: null,

        lastWithdrawDate: null,
        lastSigninDate: null,

        referredBy: signupRefBy || null,

        createdAt: Date.now()
    };

    try {

        await saveUser(newUser);

        currentUser = newUser;

        localStorage.setItem(
            "earnx_current_user",
            JSON.stringify(newUser)
        );

        alert("Signup successful! Please login.");

        switchAuthTab("login");

    } catch (error) {
        console.error(error);
    }
}

async function claimDailySignin() {

    if (!currentUser) return;

    let todayStr =
        new Date().toDateString();

    if (
        currentUser.lastSigninDate ===
        todayStr
    ) {
        alert(
            "You have already claimed today's Daily Sign-in! Please try again tomorrow."
        );
        return;
    }

    const user = getUserByPhone(
        currentUser.phone
    );

    if (!user || !user.uid) {
        alert("User record not found.");
        return;
    }

    const newBalance =
        money(user.balance) + 4;

    const newRechargeBalance =
        money(user.rechargeBal) + 4;

    try {

        await updateRecord(
            "users",
            user.uid,
            {
                balance: newBalance,
                rechargeBal: newRechargeBalance,
                lastSigninDate: todayStr
            }
        );

        alert(
            "Congratulations! ₹4 successfully added to your Recharge Balance."
        );

    } catch (error) {
        console.error(error);
    }
}

        `phonepe://pay?pa=${assignedUpi}&am=${amt}&cu=INR`;

    document.getElementById(
        "gpayAppBtn"
    ).href =
        `tez://upi/pay?pa=${assignedUpi}&am=${amt}&cu=INR`;

    document.getElementById(
        "mobikwikAppBtn"
    ).href = upiDeepLink;

    document
        .getElementById("paymentModal")
        .classList.remove("hide");

    startPaymentTimer(12 * 60);
}


function startPaymentTimer(duration) {

    let timer = duration;

    if (activeTimerInterval) {
        clearInterval(activeTimerInterval);
    }

    activeTimerInterval =
        setInterval(() => {

            let minutes =
                parseInt(
                    timer / 60,
                    10
                );

            let seconds =
                parseInt(
                    timer % 60,
                    10
                );

            minutes =
                minutes < 10
                    ? "0" + minutes
                    : minutes;

            seconds =
                seconds < 10
                    ? "0" + seconds
                    : seconds;

            document.getElementById(
                "paymentTimer"
            ).innerText =
                minutes + ":" + seconds;

            if (--timer < 0) {

                clearInterval(
                    activeTimerInterval
                );

                alert(
                    "Payment session expired."
                );

                closePaymentModal();
            }

        }, 1000);
}


function closePaymentModal() {

    if (activeTimerInterval) {
        clearInterval(activeTimerInterval);
    }

    document
        .getElementById("paymentModal")
        .classList.add("hide");
}


/* ============================================================
   DEPOSIT RECORD
   ============================================================ */

function submitPaymentProof() {

    let utr =
        document.getElementById(
            "paymentUtrInput"
        ).value.trim();

    let screenshotFile =
        document.getElementById(
            "paymentScreenshotInput"
        ).files[0];

    let utrRegex = /^\d{12}$/;

    if (
        !utr ||
        !utrRegex.test(utr)
    ) {

        alert(
            "Please enter a valid 12-digit numeric UTR / Transaction ID!"
        );

        return;
    }

    if (!screenshotFile) {

        alert(
            "Please upload the payment screenshot before submitting!"
        );

        return;
    }

    /*
     * Keep existing screenshot behavior for compatibility.
     * Large images should eventually be moved to Firebase
     * Storage rather than storing Base64 in RTDB.
     */

    let reader =
        new FileReader();

    reader.onload = async function(e) {

        let screenshotDataUrl =
            e.target.result;

        let depositId =
            makeId("DEP");

        let newDep = {

            id: depositId,

            phone: currentUser.phone,

            userUid:
                currentUser.uid || null,

            userName:
                currentUser.name ||
                "User_" +
                currentUser.phone.slice(-4),

            amount:
                currentDepositAmount,

            utr: utr,

            screenshot:
                screenshotFile.name,

            screenshotUrl:
                screenshotDataUrl,

            status: "Pending",

            date:
                new Date().toLocaleString(),

            createdAt:
                Date.now()
        };

        try {

            await saveRecord(
                "deposits",
                depositId,
                newDep
            );

            document.getElementById(
                "rechargeInputAmount"
            ).value = "";

            document.getElementById(
                "paymentUtrInput"
            ).value = "";

            document.getElementById(
                "paymentScreenshotInput"
            ).value = "";

            currentDepositAmount = 0;

            closePaymentModal();

            alert(
                "Proof submitted successfully! Awaiting system verification."
            );

            renderUserHistory();

        } catch (error) {
            console.error(error);
        }
    };

    reader.readAsDataURL(
        screenshotFile
    );
}

/* ============================================================
   WITHDRAW RECORD
   ============================================================ */

async function submitWithdrawRequest() {

    if (!currentUser) return;

    let todayStr =
        new Date().toDateString();

    if (
        currentUser.lastWithdrawDate ===
        todayStr
    ) {

        alert(
            "You have already used your 1 withdrawal limit for today!"
        );

        return;
    }

    let amt =
        parseFloat(
            document.getElementById(
                "withdrawInputAmount"
            ).value
        );

    if (!amt || amt < 100) {

        alert(
            "Minimum withdrawal amount is ₹100!"
        );

        return;
    }

    if (
        money(currentUser.withdrawBal) <
        100
    ) {

        alert(
            "Your withdrawable balance is 0 or less than minimum limit (₹100)! You cannot withdraw."
        );

        return;
    }

    if (
        amt >
        money(currentUser.withdrawBal)
    ) {

        alert(
            "Insufficient withdrawable balance!"
        );

        return;
    }

    if (amt > 30000) {

        alert(
            "Maximum withdrawal limit is ₹30,000!"
        );

        return;
    }

    if (!currentUser.bank) {

        alert(
            "Please save bank details first."
        );

        return;
    }

    let tax =
        amt * 0.12;

    let netAmt =
        amt - tax;

    const withdrawalId =
        makeId("WD");

    const user =
        getUserByPhone(
            currentUser.phone
        );

    if (!user || !user.uid) {

        alert("User record not found.");
        return;
    }

    const newWd = {

        id: withdrawalId,

        phone:
            user.phone,

        userUid:
            user.uid,

        userName:
            user.name ||
            user.bank?.name ||
            "User",

        amount:
            amt,

        netAmount:
            netAmt,

        tax:
            tax,

        bankInfo:
            user.bank,

        status:
            "Pending",

        date:
            new Date().toLocaleString(),

        createdAt:
            Date.now()
    };

    /*
     * IMPORTANT:
     * Only the withdrawal record is created here.
     * Balance/accounting changes for real-money withdrawals
     * should be handled by trusted server-side code.
     */

    try {

        await saveRecord(
            "withdraws",
            withdrawalId,
            newWd
        );

        alert(
            "Withdrawal request submitted successfully."
        );

        document.getElementById(
            "withdrawInputAmount"
        ).value = "";

        renderUserHistory();

    } catch (error) {
        console.error(error);
    }
}

function renderProducts() {

                (p.category || "VIP 1") ===
                currentInvestSubTab

/*
 * Investment record persistence.
 *
 * This function does NOT perform financial settlement logic.
 * It only demonstrates safe record-level persistence.
 */

async function investProduct(
    id,
    price,
    returnAmount
) {

    if (!currentUser) return;

    let already =
        db.investments.some(
            inv =>
                inv.phone ===
                currentUser.phone &&
                String(inv.productId) ===
                String(id)
        );

    if (already) {

        alert(
            "You can purchase this product only 1 time!"
        );

        return;
    }

    /*
     * Real-money balance deduction/crediting should be
     * validated by a trusted backend.
     *
     * The client must not be treated as the authority
     * for account balances.
     */

    const investmentId =
        makeId("INV");

    const newInv = {

        id: investmentId,

        phone:
            currentUser.phone,

        userUid:
            currentUser.uid || null,

        productId:
            id,

        price:
            money(price),

        returnAmount:
            money(returnAmount),

        maturityTime:
            Date.now() +
            24 * 60 * 60 * 1000,

        matured:
            false,

        createdAt:
            Date.now()
    };

    try {

        await saveRecord(
            "investments",
            investmentId,
            newInv
        );

        alert(
            "Investment record created successfully."
        );

        renderProducts();

    } catch (error) {
        console.error(error);
    }
}

                <div class="flex justify-between font-bold text-sm text-emerald-400">

                    <span>

                    <span>
                        ₹${money(w.amount).toFixed(2)}
                    </span>

                </div>

                <div class="text-gray-300">
                    Mobile:
                    ${escapeHtml(w.phone)}
                </div>

                <div class="bg-gray-700/50 p-2 rounded flex justify-between font-semibold text-[11px]">

                    <span>
                        Tax:
                        <strong class="text-red-400">
                            ₹${money(w.tax).toFixed(2)}
                        </strong>
                    </span>

                    <span>
                        Net:
                        <strong class="text-emerald-400">
                            ₹${money(w.netAmount).toFixed(2)}
                        </strong>
                    </span>

                </div>

                <div class="text-gray-300 font-semibold pt-1">
                    Destination Bank Details:
                </div>

                ${bankDetailsBox}

                <div class="text-[10px] text-gray-400 pt-1">
                    ${escapeHtml(w.date)}
                </div>

                <div class="pt-1 text-right">
                    ${actionBtns}
                </div>

            </div>
        `;
    });

    let adminWithdrawsListEl =
        document.getElementById(
            "adminWithdrawsList"
        );

    if (adminWithdrawsListEl) {

        adminWithdrawsListEl.innerHTML =
            wHtml ||
            '<p class="text-gray-400">No withdrawals.</p>';
    }


    /* ---------------- PRODUCTS ---------------- */

    let pHtml = "";

    db.products.forEach(p => {

        pHtml += `
            <div class="bg-gray-800 p-2.5 rounded flex justify-between items-center text-xs">

                <div>

                    <div class="font-bold">

    let adminProductsListEl =

    if (adminProductsListEl) {

}

/* ============================================================
   ADMIN DEPOSIT STATUS
   ============================================================ */

async function approveDeposit(id) {

    let dep =
        db.deposits.find(
            d =>
                String(d.id) ===
                String(id)
        );

    if (
        !dep ||
        dep.status !== "Pending"
    ) {
        return;
    }

    /*
     * Record-level status update.
     * Do not overwrite the whole deposits collection.
     */

    try {

        await updateRecord(
            "deposits",
            dep._firebaseKey || dep.id,
            {
                status: "Approved",
                approvedAt: Date.now()
            }
        );

        alert(
            "Deposit record marked as approved."
        );

        renderAdminData();

    } catch (error) {
        console.error(error);
    }
}


async function rejectDeposit(id) {

    let dep =
        db.deposits.find(
            d =>
                String(d.id) ===
                String(id)
        );

    if (!dep) return;

    try {

        await updateRecord(
            "deposits",
            dep._firebaseKey || dep.id,
            {
                status: "Rejected",
                rejectedAt: Date.now()
            }
        );

        renderAdminData();

    } catch (error) {
        console.error(error);
    }
}

/* ============================================================
   ADMIN PRODUCT CREATE
   ============================================================ */

async function adminAddProduct() {

    let name =
        document.getElementById(
            "newProdName"
        ).value.trim();

    let price =
        parseFloat(
            document.getElementById(
                "newProdPrice"
            ).value
        );

    let daily =
        parseFloat(
            document.getElementById(
                "newProdDaily"
            ).value
        );

    let category =
        document.getElementById(
            "newProdCategory"
        ).value;

    let image =
        document.getElementById(
            "newProdImage"
        ).value.trim() ||
        "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=200";


    if (
        !name ||
        !price ||
        !daily
    ) {

        alert(
            "Please fill all product fields"
        );

        return;
    }

    /*
     * IMPORTANT:
     * New product gets its own Firebase child.
     * It no longer rewrites /products or /.
     */

    const productId =
        makeId("PROD");

    const product = {

        id:
            productId,

        name:
            name,

        price:
            price,

        daily:
            daily,

        category:
            category,

        image:
            image,

        createdAt:
            Date.now()
    };

    try {

        await saveRecord(
            "products",
            productId,
            product
        );

        document.getElementById(
            "newProdName"
        ).value = "";

        document.getElementById(
            "newProdPrice"
        ).value = "";

        document.getElementById(
            "newProdDaily"
        ).value = "";

        document.getElementById(
            "newProdImage"
        ).value = "";

        alert(
            "Product published successfully in " +
            category +
            "!"
        );

        renderAdminData();

    } catch (error) {
        console.error(error);
    }
}


/* ============================================================
   ADMIN PRODUCT DELETE
   ============================================================ */

async function adminDeleteProduct(id) {

    let product =
        db.products.find(
            p =>
                String(p.id) ===
                String(id)
        );

    if (!product) return;

    let key =
        product._firebaseKey ||
        product.id;

    try {

        await deleteRecord(
            "products",
            key
        );

        renderAdminData();

    } catch (error) {
        console.error(error);
    }
}

   FORGOT PASSWORD
   ============================================================ */

function showForgotPasswordModal() {

    document
        .getElementById(
            "forgotPasswordModal"
        )
        .classList
        .remove("hide");
}


function sendForgotOTP() {

    let phone =
        document.getElementById(
            "forgotPhone"
        ).value.trim();

    let u =
        getUserByPhone(phone);

    if (!u) {

        alert(
            "Mobile number not registered"
        );

        return;
    }

    alert(
        "Password reset OTP sent: 9876"
    );

    document.getElementById(
        "forgotOtp"
    ).value = "9876";
}


async function executePasswordReset() {

    let phone =
        document.getElementById(
            "forgotPhone"
        ).value.trim();

    let otp =
        document.getElementById(
            "forgotOtp"
        ).value.trim();

    let newPass =
        document.getElementById(
            "forgotNewPassword"
        ).value;

    if (otp !== "9876") {

        alert("Invalid OTP");
        return;
    }

    if (!newPass) {

        alert(
            "Please enter a new password."
        );

        return;
    }

    let u =
        getUserByPhone(phone);

    if (!u || !u.uid) {

        alert(
            "User record not found."
        );

        return;
    }

    try {

        await updateRecord(
            "users",
            u.uid,
            {
                password: newPass
            }
        );

        alert(
            "Password updated successfully!"
        );

        document
            .getElementById(
                "forgotPasswordModal"
            )
            .classList
            .add("hide");

    } catch (error) {
        console.error(error);
    }
}
